[package]
name = "dutlib"
version = "0.1.0"
edition = "2024"

[build-dependencies]
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "2.0", features = ["full"] }

[dependencies]
clap = { version = "4.5.58", features = ["derive"] }
env_logger = "0.11.9"
errno = "0.3.14"
expectrl = { version = "0.8.0", features = ["polling"] }
log = "0.4.29"
regex = "1.12.3"
rolling-stats = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = { package = "yaml_serde", version = "0.10" }
toml = "1.1.0"

[profile.release]
# This does save nearly half a meg but it increases the incremental build time
# too much (and we don't really need the half meg)
#lto = "fat"
opt-level = "s"
# Keep the symbol table so that std::backtrace::Backtrace can resolve frames
# (strip = true drops it and leaves backtraces empty)
strip = "debuginfo"
